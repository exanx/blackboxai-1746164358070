<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote Picture Maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto&family=Montserrat&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#121212',
            darkpanel: '#1e1e1e',
            darktext: '#e0e0e0',
            darkaccent: '#3b82f6',
          }
        }
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-darkbg min-h-screen flex flex-col items-center p-6 font-sans text-darktext">
  <h1 class="text-4xl font-bold mb-6">Quote Picture Maker</h1>

  <div class="w-full max-w-6xl bg-darkpanel rounded-lg shadow-lg p-6 flex flex-col md:flex-row gap-6">
    <!-- Controls -->
    <div class="md:w-1/3 flex flex-col gap-4">
      <label class="font-semibold">Select Template</label>
      <select id="templateSelect" class="bg-darkbg border border-gray-700 rounded p-2 text-darktext">
        <option value="">-- Select a Template --</option>
        <option value="1">Inspiration</option>
        <option value="2">Motivation</option>
        <option value="3">Life</option>
      </select>

      <label class="font-semibold">Quote Text</label>
      <textarea id="quoteInput" rows="4" class="bg-darkbg border border-gray-700 rounded p-2 resize-none text-darktext placeholder-gray-500" placeholder="Enter your quote here..."></textarea>

      <label class="font-semibold">Text Color</label>
      <input type="color" id="textColor" value="#e0e0e0" class="w-full h-10 p-0 border border-gray-700 rounded cursor-pointer" />

      <label class="font-semibold">Background Color</label>
      <input type="color" id="bgColor" value="#121212" class="w-full h-10 p-0 border border-gray-700 rounded cursor-pointer" />

      <label class="font-semibold">Font Family</label>
      <select id="fontSelect" class="bg-darkbg border border-gray-700 rounded p-2 text-darktext">
        <option value="'Playfair Display', serif">Playfair Display</option>
        <option value="'Roboto', sans-serif" selected>Roboto</option>
        <option value="'Montserrat', sans-serif">Montserrat</option>
      </select>

      <label class="font-semibold">Aspect Ratio / Size</label>
      <select id="aspectRatio" class="bg-darkbg border border-gray-700 rounded p-2 text-darktext">
        <option value="4:3">4:3 (800x600)</option>
        <option value="16:9" selected>16:9 (1280x720)</option>
        <option value="1:1">1:1 (800x800)</option>
        <option value="9:16">9:16 (720x1280)</option>
      </select>

      <label class="font-semibold">Background Image</label>
      <input type="file" id="bgImageInput" accept="image/*" class="bg-darkbg border border-gray-700 rounded p-1 text-darktext" />

      <button id="downloadBtn" class="mt-4 bg-darkaccent text-white py-2 rounded hover:bg-blue-700 transition flex items-center justify-center gap-2">
        <i class="fas fa-download"></i> Download Image
      </button>
    </div>

    <!-- Preview -->
    <div class="md:w-2/3 flex justify-center items-center overflow-auto">
      <div id="quotePreview" class="relative rounded-lg shadow-lg p-6 flex items-center justify-center text-center max-w-full max-h-[80vh]"
        style="background-color: #121212; font-family: 'Roboto', sans-serif; color: #e0e0e0;">
        <div id="quoteText" class="text-4xl font-semibold leading-relaxed px-6 break-words max-w-full"></div>
        <img id="bgImage" src="" alt="" class="absolute inset-0 w-full h-full object-cover rounded-lg opacity-30 pointer-events-none" />
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
